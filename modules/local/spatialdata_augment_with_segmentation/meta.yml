name: spatialdata_augment_with_segmentation
description: Assemble the final Visium HD SpatialData with samplesheet microscopy and optional segmentation
keywords:
  - spatialdata
  - spatial transcriptomics
  - visium hd
  - segmentation
  - microscopy
tools:
  - spatialdata:
      description: |
        SpatialData is a data framework for storing and manipulating spatial omics data.
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. [ id:'NFG021_002' ]
    - zarr_folder:
        type: directory
        description: Input Visium HD SpatialData zarr folder
        pattern: "*.zarr"
    - microscopy_image:
        type: file
        description: Full-resolution, single-channel samplesheet microscopy TIFF
        pattern: "*.tif"
    - segmentation_mask:
        type: file
        description: Optional memmappable 2D TIFF segmentation mask
        pattern: "*.tif"
  - zarr_downsample_factor:
      type: number
      description: Downsampling factor between TIFF image coordinates and the zarr coordinate system
  - microscopy_preview_max_dimension:
      type: integer
      description: Maximum width or height in pixels for the adaptively downsampled microscopy preview layer
  - chunk_size:
      type: integer
      description: Chunk size used for TIFF-backed dask arrays
output:
  zarr:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. [ id:'NFG021_002' ]
      - "*_segmentation_microscopy.zarr":
          type: directory
          description: Final SpatialData Zarr containing microscopy and optional segmentation layers
          pattern: "*_segmentation_microscopy.zarr"
  versions_container:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/spatialdata:v0.7.2:
          type: string
          description: The Docker image used by the module
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/spatialdata:v0.7.2:
          type: string
          description: The Docker image used by the module
containers:
  docker:
    linux/amd64:
      name: docker.io/nfdata/spatialdata:v0.7.2
