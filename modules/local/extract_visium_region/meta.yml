name: extract_visium_region
description: Compute Visium capture-area bounds and extract the corresponding full-resolution microscopy image
keywords:
  - spatialdata
  - spatial transcriptomics
  - visium hd
  - microscopy
  - bounds
  - crop
tools:
  - spatialdata:
      description: |
        SpatialData is a data framework for storing and manipulating spatial omics data.
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/
      licence: ["BSD-3-Clause"]
  - tifffile:
      description: |
        tifffile reads and writes TIFF, BigTIFF, OME-TIFF, and related image formats.
      homepage: https://github.com/cgohlke/tifffile
      documentation: https://iridescent.ink/tifffile/tifffile.html
      licence: ["BSD-3-Clause"]
  - zarr:
      description: |
        Zarr provides chunked access to tiled TIFF pixel data through tifffile.
      homepage: https://zarr.dev/
      documentation: https://zarr.readthedocs.io/
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. [ id:'NFG021_002' ]
    - zarr_folder:
        type: directory
        description: Input Visium HD SpatialData zarr folder
        pattern: "*.zarr"
    - microscopy_image:
        type: file
        description: Full-resolution grayscale or RGB TIFF microscopy image
        pattern: "*.{tif,tiff,btf}"
  - zarr_downsample_factor:
      type: number
      description: Downsampling factor between TIFF image coordinates and the zarr coordinate system
  - crop_padding:
      type: integer
      description: Full-resolution pixels added around each side of the capture-area crop
output:
  bounds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. [ id:'NFG021_002' ]
      - "*_visium_bounds.tsv":
          type: file
          description: Visium and padded crop bounds in full-resolution microscopy pixels
          pattern: "*_visium_bounds.tsv"
  crop:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. [ id:'NFG021_002' ]
      - "*_visium_capture_area.ome.tif":
          type: file
          description: Padded full-resolution microscopy crop containing the Visium capture area
          pattern: "*_visium_capture_area.ome.tif"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
containers:
  docker:
    linux/amd64:
      name: docker.io/nfdata/spatialdata:v0.7.2
