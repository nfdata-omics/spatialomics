name: cell2location_deconvolution
description: Train one joint Cell2location spatial model across multiple QC-annotated SpatialData samples
keywords:
  - cell2location
  - spatialdata
  - spatial transcriptomics
  - visium
  - deconvolution
tools:
  - cell2location:
      description: Cell2location maps fine-grained cell types in spatial transcriptomics data using a single-cell reference.
      homepage: https://cell2location.readthedocs.io/
      documentation: https://cell2location.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - sample_ids:
        type: list
        description: Canonically ordered sample IDs corresponding to zarr_folders
    - zarr_folders:
        type: list
        description: QC-annotated SpatialData Zarr directories for joint modelling
  - signatures:
      type: file
      description: Gene-by-cell-type expression signatures produced by CELL2LOCATION_REFERENCE
      pattern: "*_reference_signatures.csv"
output:
  posteriors:
    - cell2location_posteriors:
        type: directory
        description: Lightweight per-sample H5AD posterior results from the joint model
        pattern: "cell2location_posteriors"
  manifest:
    - cell2location_posterior_manifest.tsv:
        type: file
        description: Sample-to-posterior mapping and input dimensions
        pattern: "cell2location_posterior_manifest.tsv"
  training_history:
    - cell2location_training_history.csv:
        type: file
        description: Epoch and training ELBO history for the joint spatial model
        pattern: "cell2location_training_history.csv"
  diagnostics:
    - cell2location_joint_diagnostics.json:
        type: file
        description: Joint model settings, provenance and compact reconstruction diagnostics
        pattern: "cell2location_joint_diagnostics.json"
  versions_container:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/cell2location-cuda:v0.1.5-torch2.8.0-cuda12.9:
          type: string
          description: The Docker image used by the module
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/cell2location-cuda:v0.1.5-torch2.8.0-cuda12.9:
          type: string
          description: The Docker image used by the module
containers:
  docker:
    linux/amd64:
      name: docker.io/nfdata/cell2location-cuda:v0.1.5-torch2.8.0-cuda12.9
