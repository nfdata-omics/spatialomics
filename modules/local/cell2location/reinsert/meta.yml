name: cell2location_reinsert
description: Reinsert joint Cell2location posterior results into per-sample SpatialData and render joint diagnostics
keywords:
  - cell2location
  - spatialdata
  - spatial transcriptomics
  - deconvolution
tools:
  - spatialdata:
      description: Framework for processing spatial omics data
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/en/stable/
      licence: ["BSD-3-Clause"]
input:
  - - sample_ids:
        type: list
        description: Canonically ordered sample IDs corresponding to zarr_folders
    - zarr_folders:
        type: list
        description: Original QC-annotated SpatialData Zarr directories
  - posterior_dir:
      type: directory
      description: Per-sample posterior H5AD files from joint Cell2location inference
      pattern: "cell2location_posteriors"
  - posterior_manifest:
      type: file
      description: Sample-to-posterior mapping and input dimensions
      pattern: "cell2location_posterior_manifest.tsv"
  - training_history:
      type: file
      description: Joint-model training history
      pattern: "cell2location_training_history.csv"
  - diagnostics:
      type: file
      description: Joint-model settings and compact reconstruction diagnostics
      pattern: "cell2location_joint_diagnostics.json"
output:
  zarr:
    - "*_cell2location.zarr":
        type: directory
        description: Per-sample SpatialData containing Cell2location posterior summaries
        pattern: "*_cell2location.zarr"
  abundance_mean:
    - "*_cell2location_abundance_mean.csv":
        type: file
        description: Posterior mean abundance for every spatial location
        pattern: "*_cell2location_abundance_mean.csv"
  abundance_q05:
    - "*_cell2location_abundance_q05.csv":
        type: file
        description: Posterior q05 abundance for every spatial location
        pattern: "*_cell2location_abundance_q05.csv"
  training_history_plot:
    - cell2location_training_history.png:
        type: file
        description: Joint-model training ELBO plot
        pattern: "cell2location_training_history.png"
  reconstruction_accuracy:
    - cell2location_reconstruction_accuracy.png:
        type: file
        description: Joint expected-versus-observed reconstruction plot
        pattern: "cell2location_reconstruction_accuracy.png"
        optional: true
  reconstruction_error:
    - cell2location_reconstruction_accuracy_error.txt:
        type: file
        description: Error recorded when reconstruction diagnostics cannot be rendered
        pattern: "cell2location_reconstruction_accuracy_error.txt"
        optional: true
  joint_diagnostics:
    - cell2location_joint_diagnostics.tsv:
        type: file
        description: Compact joint-model diagnostic metrics
        pattern: "cell2location_joint_diagnostics.tsv"
  versions_container:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/spatialdata:v0.7.2:
          type: string
          description: The Docker image used by the module
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - container:
          type: string
          description: The runtime environment type
      - docker.io/nfdata/spatialdata:v0.7.2:
          type: string
          description: The Docker image used by the module
containers:
  docker:
    linux/amd64:
      name: docker.io/nfdata/spatialdata:v0.7.2
